  <rect x="970" y="305" width="460" height="62" class="box"/><text x="1200" y="345" text-anchor="middle" class="t">BGE-M3 query vector</text><path d="M1200 367V410" class="line"/>
  <rect x="930" y="410" width="250" height="72" class="box"/><text x="1055" y="442" text-anchor="middle" class="t">FAISS</text><text x="1055" y="468" text-anchor="middle" class="s">dense recall</text>
