<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#222"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#222;letter-spacing:0}.title{font-size:34px;font-weight:700}.h{font-size:23px;font-weight:700}.t{font-size:18px}.s{font-size:16px;fill:#555}.box{fill:#fff;stroke:#222;stroke-width:2}.soft{fill:#f2f2f2;stroke:#444;stroke-width:2}.line{stroke:#222;stroke-width:2.2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="1000" fill="#fff"/><text x="80" y="65" class="title">物料向量建库与混合匹配</text>
  <rect x="70" y="110" width="660" height="780" class="soft"/><text x="400" y="160" text-anchor="middle" class="h">离线建库</text>
