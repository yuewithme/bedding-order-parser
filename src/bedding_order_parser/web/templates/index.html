<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>订单解析助手</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-file-search" viewBox="0 0 24 24">
      <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
      <polyline points="14 2 14 8 20 8"/><circle cx="11.5" cy="14.5" r="2.5"/><path d="m13.3 16.3 1.7 1.7"/>
    </symbol>
    <symbol id="icon-history" viewBox="0 0 24 24">
      <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
    </symbol>
    <symbol id="icon-help" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 2-3 4"/><path d="M12 18h.01"/>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24">
      <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
    </symbol>
    <symbol id="icon-archive" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8M10 12h4"/>
    </symbol>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M10.3 2.9 1.8 17a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 2.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">订单解析助手</div>
      <nav class="primary-nav">
        <button class="nav-item active" data-route="upload" type="button" aria-label="订单解析">
          <svg class="icon"><use href="#icon-file-search"/></svg><span>订单解析</span>
        </button>
        <button class="nav-item" data-route="history" type="button" aria-label="历史记录">
          <svg class="icon"><use href="#icon-history"/></svg><span>历史记录</span>
        </button>
      </nav>
      <nav class="secondary-nav">
        <button class="plain-nav" data-message="本地订单解析助手 V1" type="button" aria-label="关于">
          <svg class="icon"><use href="#icon-info"/></svg><span>关于</span>
        </button>
        <button class="plain-nav" data-route="help" type="button" aria-label="帮助">
          <svg class="icon"><use href="#icon-help"/></svg><span>帮助</span>
        </button>
      </nav>
    </aside>
    <main class="workspace">
      <button class="display-button" id="displayButton" type="button" title="调整显示对比度" aria-label="调整显示对比度">
        <svg class="icon"><use href="#icon-sun"/></svg>
      </button>
      <div id="app" aria-live="polite"></div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <section class="json-modal">
      <header><h2 id="previewTitle">JSON 预览</h2><button class="icon-button" id="closePreview" aria-label="关闭预览"><svg class="icon"><use href="#icon-x"/></svg></button></header>
      <pre id="previewContent"></pre>
    </section>
  </div>
  <div class="toast hidden" id="toast" role="status"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
